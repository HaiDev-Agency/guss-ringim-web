<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification Portal | G.U.S.S. Ringim</title>
    <meta name="description"
        content="Official Document and Identity Verification Portal for Government Unity Secondary School, Ringim.">
    <link rel="icon" type="image/png" href="assets/images/Adobe_Express_file.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { gussGreen: '#005A36', gussGold: '#D4AF37', gussNavy: '#0F172A' } } } }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        /*  TRUE GLASSMORPHISM */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        body {
            background-image: linear-gradient(to bottom right, rgba(15, 23, 42, 0.9), rgba(0, 90, 54, 0.9)), url('/portals/assets/images/school_bg.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body class="text-slate-200 font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <header class="glass-panel shadow-lg z-40 py-4 px-4 sticky top-0 border-b-0">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="assets/images/logo_img.png" alt="G.U.S.S. Crest" class="h-12 w-auto drop-shadow-md">
                <div>
                    <h1 class="font-black text-lg tracking-tight text-emerald-400 uppercase leading-tight">Verification
                        Portal</h1>
                    <p class="text-[10px] text-slate-400 tracking-widest uppercase font-bold">Document & Identity
                        Authentication</p>
                </div>
            </div>
            <a href="../public/index.html"
                class="text-xs font-bold text-slate-300 hover:text-white transition-colors bg-white/10 px-4 py-2 rounded-full shadow-sm border border-white/10"><i
                    class="fa-solid fa-house mr-1"></i> Home</a>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto px-4 py-12 flex-1 flex flex-col items-center justify-center relative z-10">

        <div class="w-full glass-panel rounded-[2rem] p-8 md:p-12 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-gussGold via-gussGreen to-blue-500">
            </div>

            <div
                class="w-24 h-24 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-inner border border-emerald-500/30">
                <i class="fa-solid fa-shield"></i>
            </div>

            <h2 class="text-3xl font-black text-white uppercase tracking-wide mb-3">Authenticate Document</h2>
            <p class="text-sm text-slate-400 mb-10 max-w-lg mx-auto leading-relaxed">Enter the Secure Tracking ID,
                Certificate Number, or Admission Number found on the document to verify its cryptographic authenticity.
            </p>

            <form id="verifyForm" class="relative max-w-xl mx-auto mb-8">
                <i class="fa-solid fa-barcode absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
                <input type="text" id="verifyInput" placeholder="e.g. GUSSR/SVC/2026/012"
                    class="w-full bg-slate-900/50 border-2 border-slate-700 rounded-2xl pl-14 pr-36 py-5 text-base font-black text-white focus:outline-none focus:border-emerald-500 focus:bg-slate-900 transition-all uppercase tracking-widest shadow-inner placeholder-slate-600"
                    required autocomplete="off">
                <button type="submit" id="verifyBtn"
                    class="absolute right-2 top-2 bottom-2 bg-emerald-600 hover:bg-emerald-500 text-white px-8 rounded-xl font-black uppercase tracking-widest text-xs transition-all shadow-md hover:shadow-lg">
                    Verify
                </button>
            </form>

            <div id="resultPane" class="hidden text-left animate-fade-in w-full max-w-xl mx-auto"></div>
        </div>

    </main>

    <footer class="text-slate-500 py-6 text-center text-xs font-medium relative z-10">
        <p>&copy; 2026 Government Unity Secondary School, Ringim. All rights reserved.</p>
    </footer>

    <script type="module" src="assets/js/verify_app.js"></script>
</body>

</html>
