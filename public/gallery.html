<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | G.U.S.S. Ringim</title>
    <meta name="description"
        content="View the vibrant campus life, academic facilities, and athletic events of Government Unity Secondary School, Ringim through our photo gallery.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/gussr_logo_transparent.png">
    <link rel="stylesheet" href="assets/css/styles.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { gussGreen: '#005A36', gussGold: '#D4AF37', gussNavy: '#0F172A' } } } }
    </script>
    <!-- Enterprise Security & UI Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden">

    <div id="guss-header"></div>

    <!-- Page Header -->
    <header class="relative bg-gussNavy overflow-hidden min-h-[40vh] flex items-center">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?auto=format&fit=crop&q=80&w=1920"
                alt="Gallery" class="w-full h-full object-cover opacity-30 mix-blend-overlay grayscale">
        </div>
        <div class="absolute inset-0 hero-overlay z-10"></div>
        <div
            class="absolute inset-0 opacity-20 bg-[radial-gradient(#005A36_1px,transparent_1px)] [background-size:16px_16px] z-10">
        </div>

        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 relative z-20 w-full text-center">
            <span
                class="bg-gussGold/20 border border-gussGold/50 text-gussGold font-black px-4 py-1.5 rounded-full text-[10px] uppercase tracking-widest mb-6 inline-block backdrop-blur-sm shadow-inner">
                Visual Archives
            </span>
            <h1
                class="text-4xl sm:text-5xl lg:text-6xl font-black uppercase tracking-tight leading-[1.1] text-white drop-shadow-2xl mb-4">
                Campus <span class="text-gussGold">Gallery</span>
            </h1>
            <p class="text-slate-300 text-sm sm:text-base max-w-2xl mx-auto font-medium">Explore life at G.U.S.S. Ringim
                through our curated visual archives of academics, sports, and cultural events.</p>
            <div
                class="flex items-center justify-center gap-3 mt-6 text-[10px] font-bold uppercase tracking-widest text-slate-300">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <i class="fa-solid fa-chevron-right text-[8px] text-gussGold"></i>
                <span class="text-gussGreen">Campus Gallery</span>
            </div>
        </div>
    </header>

    <!-- Dynamic Gallery Section -->
    <section class="py-20 bg-white relative min-h-screen">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">

            <!-- Filters -->
            <div class="flex flex-wrap justify-center gap-3 mb-12 border-b border-slate-200 pb-8">
                <button onclick="filterGallery('All')" data-filter="All"
                    class="gallery-filter-btn bg-gussGreen text-white px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-colors shadow-sm">All
                    Photos</button>
                <button onclick="filterGallery('Campus')" data-filter="Campus"
                    class="gallery-filter-btn bg-white border border-slate-200 text-slate-600 hover:border-gussGreen hover:text-gussGreen px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-colors shadow-sm">Campus
                    & Facilities</button>
                <button onclick="filterGallery('Academics')" data-filter="Academics"
                    class="gallery-filter-btn bg-white border border-slate-200 text-slate-600 hover:border-gussGreen hover:text-gussGreen px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-colors shadow-sm">Academics</button>
                <button onclick="filterGallery('Events')" data-filter="Events"
                    class="gallery-filter-btn bg-white border border-slate-200 text-slate-600 hover:border-gussGreen hover:text-gussGreen px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-colors shadow-sm">Events
                    & Culture</button>
                <button onclick="filterGallery('Sports')" data-filter="Sports"
                    class="gallery-filter-btn bg-white border border-slate-200 text-slate-600 hover:border-gussGreen hover:text-gussGreen px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-colors shadow-sm">Sports</button>
            </div>

            <!-- Handled via app.js -->
            <div id="dynamicGalleryGrid" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-4 space-y-4">
                <!-- Images injected here -->
            </div>
        </div>
    </section>

    <div id="guss-footer"></div>

    <!-- Admission Modal and App.js -->
    <div id="admissionListModal"
        class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <!-- Content handled by JS -->
    </div>

    <script type="module" src="assets/js/public_app.js" defer></script>
</body>

</html>
